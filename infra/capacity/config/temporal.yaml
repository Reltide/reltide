log:
  stdout: true
  level: warn
persistence:
  defaultStore: default
  visibilityStore: visibility
  numHistoryShards: 1
  datastores:
    default:
      sql:
        pluginName: postgres12
        databaseName: temporal
        connectAddr: temporal-pg:5432
        connectProtocol: tcp
        user: temporal
        password: synthetic-temporal
        maxConns: 2
        maxIdleConns: 1
        maxConnLifetime: 1h
    visibility:
      sql:
        pluginName: postgres12
        databaseName: temporal_visibility
        connectAddr: temporal-pg:5432
        connectProtocol: tcp
        user: temporal
        password: synthetic-temporal
        maxConns: 2
        maxIdleConns: 1
        maxConnLifetime: 1h
global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: __CAPACITY_BROADCAST_ADDRESS__
  pprof:
    port: 0
services:
  frontend:
    rpc: { grpcPort: 7233, membershipPort: 6933, bindOnIP: 0.0.0.0 }
  history:
    rpc: { grpcPort: 7234, membershipPort: 6934, bindOnIP: 0.0.0.0 }
  matching:
    rpc: { grpcPort: 7235, membershipPort: 6935, bindOnIP: 0.0.0.0 }
  worker:
    rpc: { membershipPort: 6939, bindOnIP: 0.0.0.0 }
clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active:
      { enabled: true, initialFailoverVersion: 1, rpcAddress: temporal:7233 }
dcRedirectionPolicy: { policy: noop }
publicClient: { hostPort: temporal:7233 }
